name: go_stock_mobile
description: "go-stock 移动端 - AI 赋能股票分析"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 网络请求
  dio: ^5.8.0+1

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 本地存储
  shared_preferences: ^2.5.3

  # JSON 序列化
  json_annotation: ^4.9.0

  # 图表
  fl_chart: ^0.70.2

  # 工具
  intl: ^0.20.2
  url_launcher: ^6.3.1

  cupertino_icons: ^1.0.8

  # Markdown 渲染
  flutter_markdown: ^0.7.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
