name: API CI

on:
  push:
    branches: [dev, develop, feature/mobile-migration, feature/*]
  pull_request:
    branches: [dev, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Go Lint ───────────────────────────────────────────────────────────────
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # ── Go Vet ────────────────────────────────────────────────────────────────
  go-vet:
    name: Go Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum
      - name: Vet API server
        run: go vet ./cmd/server/...
      - name: Vet API package
        run: go vet ./internal/...
      - name: Vet backend packages
        run: go vet ./backend/data/... ./backend/models/... ./backend/db/... ./backend/logger/...

  # ── Go Build ──────────────────────────────────────────────────────────────
  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum
      - name: Build API server
        run: go build -o /dev/null ./cmd/server/
      - name: Build API package
        run: go build ./internal/...
      - name: Build backend data package
        run: go build ./backend/data/...

  # ── Go Test ───────────────────────────────────────────────────────────────
  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum
      - name: Create data directory
        run: mkdir -p data
      - name: Test backend packages
        run: go test ./backend/data/... ./backend/models/... ./internal/... -v -count=1 -timeout 120s
        env:
          CGO_ENABLED: "1"
